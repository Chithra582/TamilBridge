name: fingerprint-calculator
description: Calculate updated 6-axis error fingerprint scores from detected error tags.
input_schema:
  type: object
  properties:
    error_tags:
      type: array
      items:
        type: string
      description: List of category tags identified in the recent utterance.
    current_scores:
      type: object
      description: Existing 6-category score map (0 to 100).
  required:
    - error_tags
