services:
  # ── Backend: FastAPI ─────────────────────────────────────────────────────────
  - type: web
    name: tamilbridge-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # set manually in Render dashboard (secret)
      - key: CORS_ORIGINS
        sync: false          # set after you know the frontend URL
      - key: DATABASE_URL
        value: sqlite:///./tamilbridge.db
    disk:
      name: tamilbridge-db
      mountPath: /opt/render/project/src
      sizeGB: 1

  # ── Frontend: React/Vite static site ─────────────────────────────────────────
  - type: web
    name: tamilbridge-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false          # set to https://tamilbridge-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
